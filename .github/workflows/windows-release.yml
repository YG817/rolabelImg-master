name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          architecture: 'x64'
          cache: pip
          cache-dependency-path: packaging/requirements-windows.txt
      - name: Verify release version
        shell: pwsh
        run: |
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Git tag must match APP_VERSION'
          }
      - name: Install Python dependencies
        run: python -m pip install -r packaging/requirements-windows.txt
      - name: Test source
        env:
          QT_QPA_PLATFORM: offscreen
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
        run: python -m pytest -q
      - name: Install Inno Setup
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler)) {
            choco install innosetup --version=6.4.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
      - name: Build client and installer
        run: python tools/build_windows.py
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/*
          if-no-files-found: error
      - name: Create draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $draft = gh release view "$env:GITHUB_REF_NAME" --json isDraft --jq .isDraft --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'Refusing to overwrite an already published release' }
          } else {
            gh release create "$env:GITHUB_REF_NAME" --draft --verify-tag --title "roLabelImg $env:GITHUB_REF_NAME" --notes-file packaging/RELEASE_NOTES.md --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          }
          $assets = Get-ChildItem -LiteralPath release -File | ForEach-Object { $_.FullName }
          gh release upload "$env:GITHUB_REF_NAME" @assets --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed' }
